# Проверка правой стороны для «Горечи» и «Касания усика» перед тем, как включать её в интерфейс (D-047).
# Считает только движок: он совпадает с эталоном Brian2 по пункту А (D-031); прогонов Brian2 для этих условий нет.
# Число повторов и длительность — те же, что в config/reference.yaml; зерно — crc32('engine-main:<условие>').
# Левые условия опытов (сахар 100 Гц, сахар 100 + горечь 200 Гц) берутся из основной проверки.
# Группы bitter_right и antenna_right — правые двойники по таблице аннотаций (config/neuron_groups.yaml, D-047).
# У antenna_right двойников нет, поэтому опытов для усика здесь нет.

conditions:
  # Мерило — сахар, зеркало Б1: правый список статьи (D-034) против левого (sugar_100hz).
  - key: sugar_right_100hz
    name_ru: сахар справа 100 Гц
    excite: {group: sugar_right, hz: 100}
  # Горечь — зеркало Б3 с теми же частотами, что в статье.
  - key: sugar_right_100hz_bitter_right_200hz
    name_ru: сахар справа 100 + горечь справа 200 Гц
    excite: {group: sugar_right, hz: 100}
    excite2: {group: bitter_right, hz: 200}
  # Для сведения, на решение не влияет: при 200 Гц правый сахар включает MN9 заметно (D-034).
  - key: sugar_right_200hz
    name_ru: сахар справа 200 Гц
    excite: {group: sugar_right, hz: 200}
  - key: sugar_right_200hz_bitter_right_200hz
    name_ru: сахар справа 200 + горечь справа 200 Гц
    excite: {group: sugar_right, hz: 200}
    excite2: {group: bitter_right, hz: 200}

  # [ЧЕСТНОСТЬ] Добавлено после того, как увидели результат (D-047), только для объяснения, на решение не влияет:
  # подавляют ли сахар слева те 8 левых нейронов горечи (LB1a), у которых нашлись двойники.
  - key: sugar_100hz_bitter_paired_left_200hz
    name_ru: сахар слева 100 + горечь слева, только LB1a, 200 Гц
    excite: {group: sugar, hz: 100}
    excite2: {group: bitter_paired_left, hz: 200}
