    honesty_ru: >-
      Прямое включение нейронов, а не настоящий сахар. С 2023 года классификацию уточнили:
      по нынешней таблице из 20 найденных нейронов только 11 «сахарные» (9 sugar, 2 sugar/low_salt),
      остальные — high_salt/heavy_metal (5) и putative_attractive (4). Список статьи используем как есть (D-012).
    paper: {file: figures.ipynb, name: neu_sugar}
