# Группы нейронов: стимулы и «исполнители» (D-012…D-014, D-025; docs/DATA.md, раздел 2).
#
# Состав группы задаётся одним из трёх способов:
#   paper_ids — номера из статьи Shiu et al. 2024. Поле `paper` говорит, где именно они записаны
#               в репозитории Shiu (коммит 91bdd1e; файл скачивает `flybrain fetch-data`).
#               Номера там — версии FlyWire 630. У каждого номера статус:
#                 in_783     — «из статьи, номер не менялся»: этот номер есть и в версии 783;
#                 not_in_783 — «не найден в 783»: номер изменился. Такой нейрон не используем
#                              и не подменяем «похожим» (D-012).
#   select    — отбор по таблице аннотаций FlyWire (тип клетки, сторона, класс).
#               Если у группы есть ещё и `paper_ids`, найденные номера из статьи обязаны попасть в отбор:
#               так проверяется, что тип выбран правильно.
#   union     — объединение других групп того же раздела.
#
# [ЧЕСТНОСТЬ] Всё, что выбрано не статьёй, а нами, подписано полем `honesty_ru`.
# `flybrain build-data` сверяет списки с оригиналом статьи, а статусы — с данными 783.
# Если хоть что-то не сходится, команда останавливается с ошибкой.
# Комментарий после номера — тип, подкласс и сторона по нынешней таблице аннотаций (для справки).

stimuli:
  sugar:
    name_ru: Сахар
