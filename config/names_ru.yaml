# Понятные русские имена для подсказок, легенды и панелей (коммиты C7, C8, C11).
# Ключи — значения из таблицы аннотаций FlyWire (docs/DATA.md, раздел 1.3).

# Типы клеток (cell_type): короткое имя из литературы и пояснение.
# В подсказке показывается «<short> — <name>», например «MN9 — мотонейрон хоботка».
cell_types:
  CB0701: {short: MN9, name: мотонейрон хоботка (вытягивает хоботок к еде)}
  DNp01: {short: GF, name: гигантское волокно — нейрон реакции побега}
  DNg62: {short: aDN1, name: нисходящий нейрон груминга (чистки) усика}
  DNge078: {short: aDN2, name: нисходящий нейрон груминга (чистки) усика}
  SAD093: {short: aBN1, name: промежуточный нейрон груминга (чистки) усика}
  DNa01: {short: DNa01, name: нисходящий нейрон поворота при ходьбе}
  DNa02: {short: DNa02, name: нисходящий нейрон поворота при ходьбе}
  CB0553: {short: Roundup, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0499: {short: Rattle, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0062: {short: Phantom, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0008: {short: Usnea, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0038: {short: Fdg, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0366: {short: FMIn, name: нейрон цепи кормления (Shiu et al. 2024)}
  CB0616: {short: G2N-1, name: вкусовой нейрон второго порядка (Shiu et al. 2024)}
  LPLC2: {short: LPLC2, name: зрительный нейрон, чувствует приближающийся объект}
  LC4: {short: LC4, name: зрительный нейрон, чувствует приближающийся объект}
  LB1a: {short: LB1a, name: вкусовой нейрон хоботка}
  LB1b: {short: LB1b, name: вкусовой нейрон хоботка}
  LB1c: {short: LB1c, name: вкусовой нейрон хоботка}
  LB1d: {short: LB1d, name: вкусовой нейрон хоботка}
  LB1e: {short: LB1e, name: вкусовой нейрон хоботка}
  LB2a: {short: LB2a, name: вкусовой нейрон хоботка}
  LB2b: {short: LB2b, name: вкусовой нейрон хоботка}
  LB2c: {short: LB2c, name: вкусовой нейрон хоботка}
  LB3a: {short: LB3a, name: вкусовой нейрон хоботка}
  LB3b: {short: LB3b, name: вкусовой нейрон хоботка}
  LB3c: {short: LB3c, name: вкусовой нейрон хоботка}
  LB3d: {short: LB3d, name: вкусовой нейрон хоботка}
  LB4b: {short: LB4b, name: вкусовой нейрон хоботка}

# Крупные классы (super_class) — для легенды и подсказки.
super_classes:
  optic: зрительная доля
  central: центральный мозг
  sensory: чувствительный (сенсорный)
  visual_projection: зрительный проекционный (из зрительной доли в центральный мозг)
  visual_centrifugal: зрительный центробежный (из центрального мозга в зрительную долю)
  ascending: восходящий (из тела в мозг)
  sensory_ascending: чувствительный восходящий (из тела в мозг)
  descending: нисходящий (из мозга в тело)
  motor: моторный
  endocrine: эндокринный (выделяет гормоны)
  missing: без аннотации

# Сторона (side) — со стороны самой мухи (D-011).
sides:
  left: левая
  right: правая
  center: по центру
  na: не указана
  missing: без аннотации

# Предсказанный медиатор (top_nt).
neurotransmitters:
  acetylcholine: ацетилхолин
  glutamate: глутамат
  gaba: ГАМК
  dopamine: дофамин
  serotonin: серотонин
  octopamine: октопамин
  missing: не предсказан

# Знак нейрона в модели Shiu (столбец `sign` таблицы нейронов, D-025).
signs:
  1: возбуждающий
  -1: тормозящий
  0: нет выходных связей
