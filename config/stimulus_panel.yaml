# Кнопки панели стимулов (C10, D-034). Группы нейронов описаны в neuron_groups.yaml.
#
# sides      — какая группа включается на каждой стороне мухи (со стороны мухи, D-011).
#              Если указана одна сторона, выбор стороны в интерфейсе отключён и показывается side_lock_ru;
#              side_lock_short_ru — короткая строка под кнопкой (без неё — «в статье список только для одной стороны»).
# experiment — пометка «эксперимент» (опыт, которого нет в статье, D-013).
#
# [ЧЕСТНОСТЬ] Вторую сторону для стимула добавляем, когда в статье Shiu есть готовый список нейронов для неё.
# Правых двойников по таблице аннотаций (группы с mirror_of в neuron_groups.yaml, D-047) ставим на кнопку, только
# если их пропустила проверка `flybrain validate` (раздел Е отчёта; тест сверяет это с docs/validation/summary.json).
# Для горечи и усика проверка их не пропустила (D-047), поэтому у этих кнопок только левая сторона.
# Исключение — «тень»: этот стимул целиком наш (в статье его нет), обе стороны отбираются одним правилом.

buttons:
  - key: sugar
    sides: {left: sugar, right: sugar_right}
    side_note_ru: >-
      Для сахара в статье есть списки для обеих сторон, но разной длины: левый — 21 нейрон (рис. 1 и др.),
      правый — 10 (рис. S1D). Поэтому результаты левой и правой сторон нельзя сравнивать «один к одному».

  - key: bitter
    sides: {left: bitter}
    side_lock_ru: >-
      Выбор стороны отключён. В статье список горьких нейронов есть только для левой стороны мухи. Правых двойников
      мы искали по таблице аннотаций FlyWire (тип клетки + сторона, D-047): однозначно они нашлись только для части
      списка (тип LB1a), и в проверке почти не подавляют ответ MN9 на сахар, тогда как левая горечь убирает его
      целиком. Зеркальной картины нет, поэтому правую сторону не включаем (docs/VALIDATION.md, раздел Е).
    side_lock_short_ru: >-
      Сторона не выбирается: в статье список только для левой стороны, а правые двойники проверку не прошли (ⓘ).

  - key: antenna
    sides: {left: antenna}
    side_lock_ru: >-
      Выбор стороны отключён. В статье список нейронов Джонстонова органа есть только для левой стороны мухи.
      Правых двойников по таблице аннотаций FlyWire (тип клетки + сторона, D-047) однозначно не найти ни для одного:
      статья берёт лишь часть нейронов каждого типа, а какие из правых им соответствуют, таблица не говорит.
      Второй стороны мы не придумываем (docs/VALIDATION.md, раздел Е).
    side_lock_short_ru: >-
      Сторона не выбирается: в статье список только для левой стороны, а однозначных двойников справа нет (ⓘ).

  - key: shadow
    experiment: true
    sides: {left: shadow_left, right: shadow_right}
    side_note_ru: >-
      Обе стороны отобраны нами одним правилом (зрительные нейроны LPLC2 и LC4 нужной стороны): в статье
      этого стимула нет, поэтому «списка только для одной стороны» здесь нет.
