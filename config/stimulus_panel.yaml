# Кнопки панели стимулов (C10, D-034). Группы нейронов описаны в neuron_groups.yaml.
#
# sides      — какая группа включается на каждой стороне мухи (со стороны мухи, D-011).
#              Если указана одна сторона, выбор стороны в интерфейсе отключён и показывается side_lock_ru.
# experiment — пометка «эксперимент» (опыт, которого нет в статье, D-013).
#
# [ЧЕСТНОСТЬ] Вторую сторону для стимула добавляем только тогда, когда в статье Shiu есть готовый список
# нейронов для неё. Подбирать «зеркальных двойников» по типам клеток не нужно: это уже наша догадка, а не данные.
# Исключение — «тень»: этот стимул целиком наш (в статье его нет), обе стороны отбираются одним правилом.

buttons:
  - key: sugar
    sides: {left: sugar, right: sugar_right}
    side_note_ru: >-
      Для сахара в статье есть списки для обеих сторон, но разной длины: левый — 21 нейрон (рис. 1 и др.),
      правый — 10 (рис. S1D). Поэтому результаты левой и правой сторон нельзя сравнивать «один к одному».

  - key: bitter
    sides: {left: bitter}
    side_lock_ru: >-
      Выбор стороны отключён: в статье список горьких нейронов есть только для одной стороны мухи (левой).
      Второй стороны мы не придумываем.

  - key: antenna
    sides: {left: antenna}
    side_lock_ru: >-
      Выбор стороны отключён: в статье список нейронов Джонстонова органа есть только для одной стороны мухи
      (левой). Второй стороны мы не придумываем.

  - key: shadow
    experiment: true
    sides: {left: shadow_left, right: shadow_right}
    side_note_ru: >-
      Обе стороны отобраны нами одним правилом (зрительные нейроны LPLC2 и LC4 нужной стороны): в статье
      этого стимула нет, поэтому «списка только для одной стороны» здесь нет.
