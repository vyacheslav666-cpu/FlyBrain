# Панель «исполнителей» (C11, D-035): что ожидается от каждого включённого стимула.
#
# Список самой панели — группы motor_all (110) и descending_all (1299) из groups.json: весь класс по таблице аннотаций.
# Блок «ожидается по статье» собирается из expected: показывается, когда включены ВСЕ стимулы из needs.
# Если для тех же нейронов подходит запись с большим needs (сахар + горечь вместо одного сахара), показывается она одна.
#
# needs   — ключи кнопок из stimulus_panel.yaml.
# readout — группа из раздела readouts файла neuron_groups.yaml.
# which   — all: оба нейрона типа (как в проверке Б1); paper: только нейрон, номер которого записан в figures.ipynb
#           (как в проверках Б5, Б6; пара на другой стороне в статье не использована).
# source  — paper: ожидание взято из статьи Shiu et al. 2024; own: наш выбор, помечается [ЧЕСТНОСТЬ] (D-013).
# test    — active: галочка ✓, если частота за последнюю 1 с модели не меньше 1 Гц (D-018, flybrain.reference.ACTIVE_HZ);
#           weaker: только показываем частоту — порог «не больше половины ответа на сахар» (Б3) требует знать ответ
#           на один сахар, а при живом показе его нет рядом, поэтому галочку не ставим.

expected:
  - needs: [sugar]
    readout: MN9
    which: all
    source: paper
    test: active
    why_ru: опыт Б1 — сахар включает MN9 с обеих сторон

  - needs: [sugar, bitter]
    readout: MN9
    which: all
    source: paper
    test: weaker
    why_ru: опыт Б3 — с сильной горечью ответ MN9 на сахар должен быть слабее (не больше половины)

  - needs: [antenna]
    readout: aDN1
    which: paper
    source: paper
    test: active
    why_ru: опыт Б5 — касание усика включает нейроны груминга усика

  - needs: [antenna]
    readout: aDN2
    which: paper
    source: paper
    test: active
    why_ru: опыт Б5

  - needs: [antenna]
    readout: aBN1
    which: paper
    source: paper
    test: active
    why_ru: опыт Б5

  - needs: [shadow]
    readout: GF
    which: all
    source: own
    test: active
    why_ru: опыт В — не из статьи; смотрим, включится ли гигантское волокно

# Пояснения, которые показываются рядом с ожиданиями, когда включён стимул (и выбрана сторона, если она указана).
# alone: true — только если больше ни один стимул не включён.
caveats:
  - stimulus: sugar
    side: right
    text_ru: >-
      Правый список сахара в статье короче (9 нейронов, рис. S1D). В нашей проверке (D-034) на 100 Гц он включает
      MN9 слабо (около 2–4 Гц), заметно — около 200 Гц. Это свойство списка, не ошибка.
  - stimulus: bitter
    alone: true
    text_ru: >-
      Горечь сама по себе ожидаемого «исполнителя» в плане не имеет: в статье она проверяется вместе с сахаром (Б3).
      Включите сахар и горечь вместе, чтобы увидеть, как слабеет MN9.
  - stimulus: antenna
    text_ru: >-
      Это прямое включение нейронов Джонстонова органа, не физическое касание (D-014). В нашей проверке (D-034)
      aDN1 и aDN2 включаются слабо — чуть выше порога 1 Гц.
