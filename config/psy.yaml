# Эксперимент P1 «психоделик» в режиме «мозг в банке» (docs/EXPERIMENT_PSY.md; решения D-053…D-056).
# [ЧЕСТНОСТЬ] Это вычислительная гипотеза: нейроны, получающие серотониновый вход, становятся возбудимее — так,
# как от агониста рецептора 5-HT2A. Это не модель того, что «чувствует» муха. Всё в этом файле — наш выбор,
# а не данные коннектома. Параметры модели Shiu (D-005) и веса связей не меняются.

# Какие нейроны серотониновые (D-054): strict — серотонин подтверждён окраской антителами или клонами из
# серотониновых линий; broad — любая ссылка в литературе (проверка устойчивости вывода).
criterion: strict
sensitivity_criterion: broad

# Форма эффекта (D-055): порог нейрона i ниже на d · ΔV · s_i / (s_i + s_half), s_i — его серотониновые синапсы.
delta_v_mv: 1.0  # ΔV: снижение порога при дозе 1 у нейрона с h = 1, мВ (зазор «покой — порог» у Shiu — 7 мВ)
s_half: 5  # при скольких серотониновых синапсах h = 1/2 (порог «надёжной связи» FlyWire — 5 синапсов)

# Протокол одного расчёта (D-056). Метрики — за время стимула (1 с, как в Б2); потом стимул выключается,
# и по тому, гаснет ли активность, видно разгон.
trials: 30
stimulus_ms: 1000
after_ms: 500
bin_ms: 9  # шаг записи суммарной активности: 5 блоков по 1,8 мс

# Разгон (D-056), правило записано до расчётов: после выключения стимула активность не гаснет — за 300–500 мс
# после выключения спайков не стимулируемых нейронов не меньше 10 % от последних 200 мс стимула.
runaway:
  late_window_ms: [800, 1000]
  after_window_ms: [1300, 1500]
  min_ratio: 0.10
  # Поиск дозы разгона: сахар 40 Гц, 10 повторов, дозы по возрастанию.
  condition: sugar_40hz
  trials: 10
  doses: [0, 0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20]

# Дозы основного опыта — по правилу D-056, записанному до расчётов: поиск дал дозу разгона d* = 5 (по обоим
# критериям); дозы — 0 и d*/4, d*/2, 3d*/4, округлённые до 0,25; доза d* считается отдельно.
doses: [0, 1.25, 2.5, 3.75]
runaway_dose: 5

# Стимулы основного опыта; у каждого — «исполнитель», за которым следим, и модальность стимула.
conditions:
  - key: sugar_40hz
    name_ru: сахар 40 Гц
    group: sugar
    hz: 40
    modality: gustatory
    readout: {name: MN9, root_id: "720575940660219265"}  # MN9 из статьи (правый, напротив стимула)
    threshold_hz: [10, 20, 30, 40, 50, 60, 80, 100]
  - key: water_200hz
    name_ru: вода 200 Гц (Д2)
    group: water
    hz: 200
    modality: gustatory
    readout: {name: MN9, root_id: "720575940660219265"}
    threshold_hz: [100, 125, 150, 175, 200]
  - key: jon_f_100hz
    name_ru: JO-F 100 Гц (Б6)
    group: jon_f
    hz: 100
    modality: mechano
    readout: {name: aBN1, root_id: "720575940630907434"}  # aBN1 из статьи (левый)
    threshold_hz: [50, 100, 150, 200]
  - key: shadow_left_100hz
    name_ru: тень слева 100 Гц ⚗
    group: shadow_left
    hz: 100
    modality: visual
    readout: {name: GF, root_id: "720575940622838154"}  # гигантское волокно на стороне стимула (левое)
    threshold_hz: [5, 10, 20, 40, 60, 100]

# Порог «исполнителя» — наименьшая частота стимула, при которой он активен (≥ 1 Гц, D-018); 10 повторов.
threshold_trials: 10

# Спонтанная активность: без стимула, с шумом мембраны σ (D-055); первые 200 мс не считаются (шум набирается).
spontaneous:
  sigmas_mv: [1, 2, 3]
  trials: 10
  warmup_ms: 200

# ---------- P1b: уточнение (D-058…D-061) ----------
p1b:
  # Откуда «зажигание» (D-058): доза 0, шум σ 1 с, затем шум выключается на 0,5 с; «зажглось» — то же правило
  # разгона, что выше (после выключения шума активность не гаснет). Варианты связей — flybrain/psymech.py.
  mechanism:
    # Последние три добавлены после первых шести: те показали, что петля — в усиковой доле, а не в грибовидных телах.
    variants: [base, no_kc_kc, apl_x2, apl_x4, no_dan_kc, no_dpm_kc, no_alln_exc, alln_gaba_fix, no_alln_exc_no_kc_kc]
    sigmas_mv: [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4]
    trials: 10
    noise_ms: 1000
    off_ms: 500
    # Держится ли на той же петле и разгон от дозы (P1, сахар 40 Гц, 10 повторов, правило D-056) — без шума.
    dose_check:
      variant: no_alln_exc
      doses: [5, 6, 8, 10, 15]
  # Режим «KC тормозятся» (D-060): у клеток Кеньона порог от дозы повышается на d · ΔV · h(s_i), у остальных
  # мишеней — снижается, как в P1. Сетка — как в P1 (строгий критерий); доза разгона ищется заново.
  kc_inhibit:
    runaway_doses: [0, 0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20, 25, 30]
    doses: [0, 1.25, 2.5, 3.75, 5]
    # По тому же правилу D-056: поиск (сахар 40 Гц, 10 повторов) дал разгон при 6 (при 5 — ни одного повтора).
    runaway_dose: 6
    # Пороги «исполнителей» — грубая сетка (правило CLAUDE.md о долгих расчётах): основная сетка этого режима почти
    # совпала с P1, полная сетка порогов (дозы до 5) вывода не меняет. Решено до просмотра оставшихся расчётов.
    threshold_doses: [0, 1.25, 2.5]
    spont_sigma_mv: 1
  # Гистерезис (D-061): доза разгона режима 1,5 с (с шумом σ — без стимула; без шума — со стимулом), затем доза 0
  # на 3 с, затем шум выключен на 1 с, затем сброс потенциалов в покой и снова шум на 1 с.
  hysteresis:
    trials: 10
    sigma_mv: 1
    condition: shadow_left_100hz
    on_ms: 1500
    back_ms: 3000
    quiet_ms: 1000
    reset_ms: 1000
