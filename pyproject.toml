[project]
name = "flybrain"
version = "0.1.0"
description = "Симуляция мозга дрозофилы на коннектоме FlyWire 783 (модель Shiu et al. 2024) с 3D-визуализацией"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14,<2.15",
    "brian2>=2.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "joblib>=1.4",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
flybrain = "flybrain.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain"]

# PyTorch берём из собственного индекса PyTorch в сборке под CUDA 13.0 (D-002).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
